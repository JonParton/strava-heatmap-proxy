name = "strava-heatmap-proxy"
main = "index.js"
workers_dev = true
preview_urls = false

compatibility_date = "2026-11-01"

# TILE_CACHE_SECS: Controls how long Cloudflare should cache each tile before
# requesting again from Strava. Use "0" to disable caching.
#
# ALLOWED_ORIGINS: Sets CORS header and checks that requests have appropriate
# origin header. If unset or empty all origins are allowed
vars = { TILE_CACHE_SECS = "86400", ALLOWED_ORIGINS = "" }

# [secrets]
# STRAVA_ID
# STRAVA_SESSION (value of _strava4_session cookie)
# PROXY_TOKEN (long random string; first path segment of every request)

# Create with: wrangler kv namespace create STRAVA_HEATMAP_PROXY_COOKIES
[[kv_namespaces]]
binding = "STRAVA_HEATMAP_PROXY_COOKIES"
id = "00ca7841615646ada159cfddf4da8e6e"
